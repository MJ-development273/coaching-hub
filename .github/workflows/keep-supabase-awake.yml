name: Keep Supabase awake

# Supabase free projects are paused after about a week without activity.
# This makes one tiny read request every day so the project never looks inactive.
# If the request fails (for example because the project IS paused), the run is marked
# as failed and GitHub emails you, which doubles as an early warning.

on:
  schedule:
    - cron: '17 7 * * *'   # every day at 07:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY secret is missing"
            exit 1
          fi
          BASE="${SUPABASE_URL%/}"
          if curl --fail --silent --show-error --max-time 30 \
            "$BASE/rest/v1/home_session?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"; then
            echo
            echo "Supabase responded OK"
          else
            echo "Supabase did not respond OK - the project may be paused or unreachable"
            exit 1
          fi
